name: Desktop package
on:
  pull_request:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'runtime/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/desktop-package.yml', 'LICENSE', 'third-party/**']
  workflow_dispatch:
concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
      - run: npm install --global pnpm@10.34.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm runtime:prepare
      - run: pnpm package:desktop
      - run: pnpm test:package
      - run: pnpm notices:verify-release
      - run: pnpm package:archive
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-${{ matrix.os }}
          # One candidate contains application + matching sources + paired receipt/checksums.
          path: artifacts/release/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-evidence-${{ matrix.os }}
          path: |
            artifacts/package/pruning.json
            artifacts/package/receipt.json
            artifacts/package/smoke.json
            artifacts/package/smoke-*.png
            artifacts/package/resources/third-party/
