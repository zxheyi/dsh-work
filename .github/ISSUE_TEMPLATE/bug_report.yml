name: Bug report / 问题反馈
description: Report a reproducible DSH Work defect with evidence / 提交一个有复现证据的 DSH Work 问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove API keys, tokens, account data, private project content, and other sensitive information before attaching diagnostics.

        上传诊断前请移除 API Key、Token、账号信息、私有项目内容及其他敏感数据。

  - type: checkboxes
    id: duplicate
    attributes:
      label: Existing reports / 提交前查重
      options:
        - label: I searched open and closed Issues for the same problem / 我已搜索已有 Issue，没有发现相同问题
          required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system / 操作系统
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows 11 x64
        - Windows 10 x64
        - Linux or unsupported / Linux 或未支持平台
        - Unknown / 不确定
    validations:
      required: true

  - type: input
    id: work_version
    attributes:
      label: DSH Work version or commit / DSH Work 版本或 Commit
      placeholder: Version, commit SHA, or Unknown / 版本、Commit SHA 或不知道
    validations:
      required: true

  - type: input
    id: harness_version
    attributes:
      label: DeepSeek Harness source/runtime version / Harness 源码或运行时版本
      placeholder: Source revision, package version, or Unknown / 源码版本、包版本或不知道
    validations:
      required: true

  - type: textarea
    id: profile_plugins
    attributes:
      label: Profile, Bundle, and third-party plugins / Profile、Bundle 与第三方插件
      placeholder: Names and versions, or None / 名称与版本，或无
    validations:
      required: true

  - type: dropdown
    id: clean_comparison
    attributes:
      label: Clean Profile comparison / 全新 Profile 对照
      options:
        - Still reproduces in a clean Profile / 全新 Profile 仍可复现
        - Does not reproduce in a clean Profile / 全新 Profile 不再复现
        - Application cannot start / 应用无法启动
        - Not tested / 未测试
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: Include exact error text and timing / 尽量包含准确报错及发生时机
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Start ... / 启动……
        2. Select ... / 选择……
        3. Observe ... / 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency / 复现频率
      options:
        - Every time / 每次
        - Often / 经常
        - Sometimes / 偶尔
        - Once / 一次
        - Unknown / 不确定
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics, logs, screenshots, or recordings / 诊断、日志、截图或录屏
      description: Attach the smallest evidence needed to reproduce and diagnose the defect / 提供复现和定位所需的最小证据

  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive information / 敏感信息
      options:
        - label: I removed credentials, account data, and private content from attachments / 我已从附件中移除凭据、账号数据和私有内容
          required: true
